<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>잎새마을 휴가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one pixel-art stage fills the screen (portrait touch screens stack the pad under it); HUD, dialog and panels are DOM layers sized in multiples of one game pixel (--px) */
:root {
  color-scheme: dark;
  --ground: #0d1411;
  --panel: rgba(16, 24, 21, 0.93);
  --panel-hi: rgba(36, 50, 43, 0.95);
  --edge: #b9985b;
  --edge-dim: #5b4a2c;
  --gold: #f5d47c;
  --ink: #f3efe0;
  --muted: #aab4a3;
  --rose: #f292b2;
  --leaf: #95d46e;
  --sky: #8fd1ee;
  --danger: #e9806e;
  --px: 3px;
  --font-display: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --fs: max(12px, calc(var(--px) * 5.2));
  --fs-s: max(11px, calc(var(--px) * 4.3));
}
html, body { height: 100%; margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font-body); overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
kbd { font-family: var(--font-display); font-size: 0.8em; line-height: 1; padding: 0.15em 0.35em; border-radius: 3px; background: #0b100d; border: 1px solid var(--edge-dim); color: var(--gold); }
body.touch kbd { display: none; }

#app { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--ground); }
#stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; background: #08100c; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.frame { background: linear-gradient(180deg, var(--panel-hi), var(--panel)); border: 1px solid var(--edge); border-radius: 3px; box-shadow: 0 0 0 1px #070b09, inset 0 0 0 1px rgba(255, 236, 190, 0.07), 0 4px 18px rgba(0, 0, 0, 0.4); }

/* HUD */
#hud { position: absolute; inset: 0; pointer-events: none; font-size: var(--fs); }
#tl { position: absolute; left: calc(8px + env(safe-area-inset-left, 0px)); top: calc(8px + env(safe-area-inset-top, 0px)); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; max-width: 60%; }
#status, #goldBox { display: flex; align-items: center; gap: 0.5em; padding: 0.3em 0.7em; font-family: var(--font-display); white-space: nowrap; }
#status canvas { width: 1.2em; height: 1.2em; image-rendering: pixelated; }
#dayText { color: var(--gold); }
#goldBox b { font-weight: normal; color: var(--gold); font-variant-numeric: tabular-nums; }
.coin { width: 0.85em; height: 0.85em; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff2b0, #e8b440 55%, #9a6a1c); box-shadow: 0 0 0 1px #4a3210; }
#menuBtns { display: flex; gap: 4px; pointer-events: auto; }
.mbtn { display: flex; align-items: center; gap: 0.35em; padding: 0.3em 0.6em; font-family: var(--font-display); font-size: var(--fs-s); background: linear-gradient(180deg, #2c3d35, #17211c); border: 1px solid var(--edge-dim); border-radius: 3px; color: var(--ink); }
.mbtn:hover { border-color: var(--edge); }
.mbtn.off { color: var(--muted); text-decoration: line-through; }

#tr { position: absolute; right: calc(8px + env(safe-area-inset-right, 0px)); top: calc(8px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; align-items: flex-end; gap: 6px; width: calc(var(--px) * 64); min-width: 150px; max-width: 34%; }
#mini { width: 100%; aspect-ratio: 4 / 1; image-rendering: pixelated; display: block; padding: 0; }
#quests { width: 100%; padding: 0.4em 0.6em 0.5em; font-size: var(--fs-s); }
#quests h3 { margin: 0 0 0.25em; font: normal 1em var(--font-display); color: var(--gold); letter-spacing: 0.02em; }
#questList { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.15em; }
#questList li { display: flex; justify-content: space-between; gap: 0.6em; color: var(--ink); }
#questList li .who { color: var(--muted); }
#questList li.done { color: var(--leaf); }
#questList li.done .cnt::after { content: " ✓"; }
#questList li .cnt { font-variant-numeric: tabular-nums; white-space: nowrap; }

#toast { position: absolute; left: 50%; top: calc(14% + env(safe-area-inset-top, 0px)); transform: translate(-50%, -6px); padding: 0.45em 1.1em; font-family: var(--font-display); background: rgba(8, 12, 10, 0.78); border: 1px solid var(--edge-dim); border-radius: 3px; opacity: 0; transition: opacity 0.25s, transform 0.25s; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

#prompt { position: absolute; left: 50%; pointer-events: auto; cursor: pointer; bottom: calc(var(--px) * 44 + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 0.5em; align-items: center; padding: 0.3em 0.8em; font-family: var(--font-display); background: rgba(8, 12, 10, 0.72); border: 1px solid var(--edge-dim); border-radius: 3px; opacity: 0; transition: opacity 0.15s; white-space: nowrap; }
#prompt.show { opacity: 1; }

#bar { position: absolute; left: 50%; bottom: calc(4px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; grid-template-columns: auto auto auto; grid-template-rows: auto auto; align-items: end; column-gap: calc(var(--px) * 2); row-gap: 3px; pointer-events: auto; }
.orb { position: relative; width: calc(var(--px) * 26); height: calc(var(--px) * 26); min-width: 40px; min-height: 40px; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 50% 40%, #2a1822, #0d080b); border: 2px solid var(--edge); box-shadow: 0 0 0 2px #070b09, inset 0 0 8px rgba(0, 0, 0, 0.8); }
.orb .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: radial-gradient(circle at 40% 0%, #ffd3e2, #f26f9c 45%, #a8305e); transition: height 0.4s; }
.orb .fill::before { content: ""; position: absolute; left: -10%; right: -10%; top: -3px; height: 6px; border-radius: 50%; background: rgba(255, 220, 235, 0.55); }
.orb::after { content: ""; position: absolute; left: 18%; top: 10%; width: 34%; height: 22%; border-radius: 50%; background: rgba(255, 255, 255, 0.22); }
#lvText { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: max(12px, calc(var(--px) * 6)); text-shadow: 0 0 3px #000, 1px 1px 0 #000; z-index: 1; }
#orbTime canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
#slots { display: flex; gap: 2px; padding: 3px; background: rgba(8, 12, 10, 0.72); border: 1px solid var(--edge-dim); border-radius: 3px; margin-bottom: calc(var(--px) * 2); }
.slot { position: relative; width: calc(var(--px) * 15); height: calc(var(--px) * 15); min-width: 38px; min-height: 38px; display: grid; place-items: center; padding: 0; background: linear-gradient(180deg, #24332c, #121a16); border: 1px solid #3c4a3f; border-radius: 2px; font-family: var(--font-display); font-size: var(--fs-s); }
.slot span { font-size: 0.85em; line-height: 1.05; text-align: center; }
.slot kbd { position: absolute; left: 1px; top: 1px; font-size: 0.7em; padding: 0.05em 0.25em; }
.slot:hover { border-color: var(--edge); }
.slot:active { background: #2f4238; }
#xpbar { grid-column: 1 / -1; height: max(4px, calc(var(--px) * 1.6)); background: #0b100d; border: 1px solid var(--edge-dim); border-radius: 2px; overflow: hidden; }
#xpFill { height: 100%; width: 0; background: linear-gradient(90deg, #f6c64c, #fff0a6); transition: width 0.4s; }

/* Dialog */
#dialog { position: absolute; left: 50%; bottom: calc(var(--px) * 46 + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(94%, 660px); display: grid; grid-template-columns: auto 1fr; gap: 0.8em; padding: 0.8em 1em 0.9em; font-size: var(--fs); pointer-events: auto; }
#portrait { width: calc(max(12px, calc(var(--px) * 5.2)) * 4.2); height: calc(max(12px, calc(var(--px) * 5.2)) * 4.2); image-rendering: pixelated; background: radial-gradient(circle at 50% 60%, #34483d, #121a16); border: 1px solid var(--edge-dim); border-radius: 3px; }
#dlgBody { min-width: 0; display: flex; flex-direction: column; gap: 0.35em; }
#dlgName { font-family: var(--font-display); color: var(--gold); font-size: 1.08em; }
#dlgText { line-height: 1.6; min-height: 3.2em; overflow-wrap: anywhere; }
#dlgOpts { display: flex; flex-wrap: wrap; gap: 0.4em; margin-top: 0.2em; }
.opt { padding: 0.35em 0.8em; background: linear-gradient(180deg, #2c3d35, #17211c); border: 1px solid var(--edge-dim); border-radius: 3px; font-family: var(--font-display); }
.opt.sel, .opt:hover { border-color: var(--gold); color: var(--gold); }
.opt[disabled] { opacity: 0.45; cursor: default; }
#dlgNext { position: absolute; right: 0.8em; bottom: 0.4em; color: var(--gold); font-size: 0.8em; animation: bob 0.8s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(3px); } }

/* Panels */
#panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(94%, 620px); max-height: 88%; display: flex; flex-direction: column; font-size: var(--fs); pointer-events: auto; z-index: 9; }
#panelHead { display: flex; align-items: center; justify-content: space-between; gap: 1em; padding: 0.5em 0.6em 0.5em 1em; border-bottom: 1px solid var(--edge-dim); background: linear-gradient(180deg, rgba(185, 152, 91, 0.16), transparent); }
#panelTitle { margin: 0; font: normal 1.15em var(--font-display); color: var(--gold); }
#panelClose { width: 2em; height: 2em; display: grid; place-items: center; background: #17211c; border: 1px solid var(--edge-dim); border-radius: 3px; }
#panelTabs { display: flex; gap: 2px; padding: 0.5em 1em 0; }
.tab { padding: 0.3em 0.9em; background: #141c18; border: 1px solid var(--edge-dim); border-bottom: none; border-radius: 3px 3px 0 0; font-family: var(--font-display); color: var(--muted); }
.tab.on { background: #24332c; color: var(--gold); }
#panelBody { padding: 0.8em 1em 1em; overflow: auto; min-height: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.4em, 1fr)); gap: 0.4em; }
.cell { position: relative; aspect-ratio: 1; display: grid; place-items: center; padding: 0; background: #101814; border: 1px solid #34413a; border-radius: 3px; }
.cell img, .cell canvas { width: 70%; height: 70%; image-rendering: pixelated; }
.cell .n { position: absolute; right: 3px; bottom: 1px; font-family: var(--font-display); font-size: 0.85em; color: var(--ink); text-shadow: 1px 1px 0 #000; }
.cell.sel { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.cell.unknown img { filter: brightness(0); opacity: 0.45; }
.desc { margin-top: 0.8em; padding: 0.6em 0.8em; min-height: 4.4em; background: #0e1512; border: 1px solid #2b3731; border-radius: 3px; line-height: 1.55; }
.desc b { font-family: var(--font-display); font-weight: normal; color: var(--gold); }
.desc .acts { display: flex; flex-wrap: wrap; gap: 0.4em; margin-top: 0.5em; }
.row-list { display: grid; gap: 0.35em; }
.shop-row { display: grid; grid-template-columns: 2.4em 1fr auto auto; align-items: center; gap: 0.6em; padding: 0.35em 0.5em; background: #101814; border: 1px solid #2b3731; border-radius: 3px; }
.shop-row img { width: 2.2em; height: 2.2em; image-rendering: pixelated; }
.shop-row .nm { min-width: 0; }
.shop-row .nm small { display: block; color: var(--muted); font-size: 0.8em; }
.shop-row .pr { font-family: var(--font-display); color: var(--gold); white-space: nowrap; font-variant-numeric: tabular-nums; }
.btn { padding: 0.35em 0.9em; background: linear-gradient(180deg, #3b5244, #1d2a23); border: 1px solid var(--edge); border-radius: 3px; font-family: var(--font-display); white-space: nowrap; }
.btn:hover { color: var(--gold); }
.btn[disabled] { opacity: 0.4; cursor: default; color: var(--muted); }
.btn.warn { border-color: var(--danger); }
.help { display: grid; grid-template-columns: auto 1fr; gap: 0.35em 1em; align-items: center; }
.help kbd { justify-self: start; }
.note { color: var(--muted); font-size: 0.88em; line-height: 1.6; }
.toggles { display: flex; flex-wrap: wrap; gap: 0.5em; margin: 0.8em 0; }

/* Result */
.result { display: grid; grid-template-columns: auto 1fr; gap: 1.2em; align-items: center; }
.rank { font: normal calc(var(--fs) * 5.5) / 1 var(--font-display); background: linear-gradient(180deg, #fff6c0, #f6c24a 50%, #c46a1e); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(2px 3px 0 #2a1408); padding: 0 0.1em; }
.stats { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.25em; }
.stats li { display: flex; justify-content: space-between; gap: 1em; border-bottom: 1px dashed #2f3b34; padding-bottom: 0.2em; }
.stats li b { font-weight: normal; font-family: var(--font-display); color: var(--gold); font-variant-numeric: tabular-nums; }

#fade { position: absolute; inset: 0; background: #05070a; opacity: 0; pointer-events: none; transition: opacity 0.8s; z-index: 8; }
#fade.on { opacity: 1; pointer-events: auto; }

/* Title */
#title { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; overflow: auto; padding: calc(12px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) calc(12px + env(safe-area-inset-left, 0px)); background: radial-gradient(ellipse at 50% 120%, rgba(10, 16, 12, 0.2), rgba(6, 10, 8, 0.55)); font-size: max(13px, calc(var(--px) * 5)); }
.title-card { width: min(100%, 560px); display: flex; flex-direction: column; align-items: center; gap: 0.9em; text-align: center; }
.logo { margin: 0; font: normal max(40px, calc(var(--px) * 22)) / 1 var(--font-display); color: #fff6d8; letter-spacing: 0.02em; text-shadow: 0 3px 0 #2c4a26, 0 0 0 #000, 3px 3px 0 #13230f, 0 0 18px rgba(160, 230, 120, 0.45); text-wrap: balance; }
.logo small { display: block; margin-top: 0.3em; font-size: 0.32em; letter-spacing: 0.35em; color: var(--leaf); text-shadow: 1px 1px 0 #0b1408; }
.tag { margin: 0; color: #e6eedb; text-shadow: 1px 1px 0 #000; line-height: 1.5; }
.maker { width: 100%; display: grid; grid-template-columns: auto 1fr; gap: 1em; padding: 0.9em 1em; text-align: left; }
#preview { width: calc(48px * 2.4); height: calc(66px * 2.4); image-rendering: pixelated; background: radial-gradient(ellipse at 50% 85%, #3c5a40, #17211c 70%); border: 1px solid var(--edge-dim); border-radius: 3px; align-self: center; }
.opts { display: grid; gap: 0.5em; min-width: 0; }
.opts label, .opts .row { display: grid; grid-template-columns: 3.6em 1fr; align-items: center; gap: 0.5em; font-family: var(--font-display); color: var(--muted); }
#nameInput { width: 100%; max-width: 12em; padding: 0.35em 0.5em; font: inherit; font-family: var(--font-body); color: var(--ink); background: #0b100d; border: 1px solid var(--edge-dim); border-radius: 3px; -webkit-user-select: text; user-select: text; }
.chips, .sw { display: flex; flex-wrap: wrap; gap: 0.3em; }
.chip { padding: 0.25em 0.7em; background: #141c18; border: 1px solid var(--edge-dim); border-radius: 3px; font-family: var(--font-display); color: var(--ink); }
.chip.on { border-color: var(--gold); color: var(--gold); }
.swatch { width: 1.7em; height: 1.7em; padding: 0; border-radius: 3px; border: 1px solid #000; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25); }
.swatch.on { outline: 2px solid var(--gold); outline-offset: 1px; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6em; justify-content: center; }
.primary { padding: 0.55em 1.6em; font: normal 1.15em var(--font-display); color: #1a1408; background: linear-gradient(180deg, #ffe9a0, #e9b44c); border: 1px solid #fff2c4; border-radius: 3px; box-shadow: 0 0 0 1px #4a3210, 0 3px 0 #6b4a18; }
.primary:active { transform: translateY(2px); box-shadow: 0 0 0 1px #4a3210, 0 1px 0 #6b4a18; }
.secondary { padding: 0.5em 1.2em; font: normal 1em var(--font-display); background: rgba(16, 24, 21, 0.85); border: 1px solid var(--edge-dim); border-radius: 3px; }
.secondary.warn { border-color: var(--danger); color: var(--danger); }
.keys { margin: 0; color: #d6dccd; font-size: 0.85em; text-shadow: 1px 1px 0 #000; line-height: 1.6; }
body.touch .keys { display: none; }

/* Touch pad */
#pad { position: relative; flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 10px calc(18px + env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) calc(18px + env(safe-area-inset-left, 0px)); background: linear-gradient(180deg, #17221d, #0d1411); border-top: 1px solid var(--edge-dim); touch-action: none; }
#stick { position: relative; width: 132px; height: 132px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02) 70%); border: 2px solid rgba(185, 152, 91, 0.55); touch-action: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #4f6a5a, #24332c); border: 2px solid var(--edge); }
#pbtns { display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; gap: 10px; align-items: center; }
#pbtns button { display: grid; place-items: center; border-radius: 50%; font: normal 22px/1 var(--font-display); color: var(--gold); background: radial-gradient(circle at 40% 35%, #3b5244, #17211c); border: 2px solid var(--edge); touch-action: none; }
#pbtns button span { font-size: 11px; color: var(--ink); margin-top: -10px; }
#bX { grid-row: 1 / span 2; grid-column: 2; width: 84px; height: 84px; }
#bC, #bZ { width: 58px; height: 58px; }
body.touch:not(.landscape) #stage { flex: 0 0 auto; height: min(56%, 92vw); }
body.touch:not(.landscape) #pad { flex: 1 1 auto; align-items: flex-end; }
body.in-title:not(.landscape) #stage { flex: 1 1 auto; height: auto; }
/* portrait phones: the HUD bar, quests and dialog live in the space above the pad */
body.touch:not(.landscape) #bar { position: fixed; top: calc(var(--stage-b, 60vh) + 12px); bottom: auto; z-index: 4; }
body.touch:not(.landscape) #quests { position: fixed; left: 50%; transform: translateX(-50%); top: calc(var(--stage-b, 60vh) + 82px); width: min(92vw, 380px); z-index: 4; }
body.touch:not(.landscape) #tr { width: 36%; max-width: 36%; min-width: 0; }
body.touch:not(.landscape) #dialog { position: fixed; top: calc(var(--stage-b, 60vh) + 8px); bottom: auto; z-index: 6; }
body.touch:not(.landscape) #prompt { bottom: 8px; }
body.touch:not(.landscape) #toast { top: auto; bottom: 44px; }
body.touch:not(.landscape) #panel { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); transform: translateX(-50%); max-height: calc(100% - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
body.touch:not(.landscape) #fade { position: fixed; }
body.landscape #pad { position: absolute; left: 0; right: 0; bottom: 0; background: none; border: none; pointer-events: none; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
body.landscape #pad > * { pointer-events: auto; }
body.landscape #stick { width: 118px; height: 118px; }
body.touch.landscape #bar { bottom: calc(4px + env(safe-area-inset-bottom, 0px)); }
body.touch.landscape .slot span { font-size: 0.8em; }
body.touch #slots .slot[data-act="interact"], body.touch #slots .slot[data-act="jump"], body.touch #slots .slot[data-act="sit"] { display: none; }

#banner { position: absolute; left: 50%; top: 24%; transform: translate(-50%, 8px); display: grid; justify-items: center; gap: 0.15em; text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.8s, transform 0.8s; z-index: 2; white-space: nowrap; }
#banner.show { opacity: 1; transform: translate(-50%, 0); }
#banner b { font: normal max(30px, calc(var(--px) * 15)) / 1 var(--font-display); letter-spacing: 0.12em; background: linear-gradient(180deg, #fffbe2, #f5d47c 55%, #c8892e); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(2px 2px 0 #1a1208) drop-shadow(0 0 10px rgba(0, 0, 0, 0.5)); }
#banner small { font: normal max(12px, calc(var(--px) * 5)) var(--font-display); color: var(--leaf); letter-spacing: 0.3em; text-shadow: 1px 1px 0 #000; }
#banner span { display: flex; align-items: center; gap: 0.8em; font-size: max(12px, calc(var(--px) * 4.6)); color: #efe8d2; text-shadow: 1px 1px 0 #000; }
#banner span::before, #banner span::after { content: ""; width: 3em; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
#banner span::after { transform: scaleX(-1); }
.slot img { width: 46%; height: auto; image-rendering: pixelated; display: block; margin: 0 auto; }
.slot { grid-template-rows: auto auto; align-content: center; gap: 1px; }

@media (prefers-reduced-motion: reduce) {
  #dlgNext { animation: none; }
  #toast, #prompt, .orb .fill, #xpFill, #banner { transition: none; }
}
</style>
</head>
<body>
<div id="app">

function walkable(x, y) {
  if (y < BAND_T || y > BAND_B || x < 14 || x > WORLD_W - 14) return false;
  if (isWater(x, y) && !onDock(x, y)) return false;
  for (const o of SOLIDS) { const dx = (x - o.x) / o.rx, dy = (y - o.y) / o.ry; if (dx * dx + dy * dy < 1) return false; }
  return true;
}
function npcVisible(id) { const [a, b] = NPC_INFO[id].hours, h = hourNow(); return h >= a && h < b; }

// --- time, weather, crops ---
function advanceTime(dt) {
  S.time += dt * MIN_PER_SEC;
  const raining = S.weather.type === 'rain' && S.time < S.weather.until;
  G.rain = lerp(G.rain, raining ? 1 : 0, Math.min(1, dt * 0.4));
  if (S.time >= 26 * 60 && !G.sleeping) goSleep(true);
  if (!S.tut.night && hourNow() >= 19.5) { S.tut.night = 1; UI.toast('밤이 되었어요. 연못가에서 반딧불이를 잡거나, 집에 들어가 잠들 수 있어요.', 5200); }
  for (const p of S.plots) {
    if (!p.crop) continue;
    if (G.rain > 0.5) p.wet = WET_TIME;
    if (p.stage < 3 && p.wet > 0) {
      p.grow += dt;
      if (p.grow >= CROPS[p.crop].t) { p.grow = 0; p.stage++; const i = S.plots.indexOf(p), [px0, py0] = PLOTS_POS[i]; for (let k = 0; k < 8; k++) spawn('spark', px0 + rand(-8, 8), py0 - rand(2, 14), { vy: -rand(10, 30), life: rand(0.6, 1.1), col: p.stage === 3 ? '#fff2a0' : '#c8ff9a' }); if (p.stage === 3) SFX.pop(); }
    }
    p.wet = Math.max(0, p.wet - dt);
  }
}

// --- player ---
function surfaceAt(x, y) { return onDock(x, y) ? 'wood' : inPlaza(x, y) ? 'stone' : 'grass'; }
function startAct(pose, dur, mid, end, tool) { P.state = 'act'; P.actPose = pose; P.actT = 0; P.actDur = dur; P.actMidFn = mid || null; P.actFn = end || null; P.tool = tool || null; P.f = 0; }
function updatePlayer(dt) {
  const q = IN.queue; IN.queue = [];

  if (P.state === 'act') {
    P.actT += dt; P.pose = P.actPose; P.ft += dt; if (P.ft > 0.25) { P.ft = 0; P.f++; }
    if (P.tool === 'can' && Math.random() < 0.6) { const hx = P.x + P.dir * 15, hy = P.y - 14; spawn('drop', hx, hy, { vx: P.dir * rand(4, 16), vy: rand(10, 30), g: 260, life: 0.5, col: pick(['#a8e0ff', '#ffffff', '#7cc8f0']) }); }
    if (P.actMidFn && P.actT >= P.actDur * 0.5) { const f = P.actMidFn; P.actMidFn = null; f(); }
    if (P.actT >= P.actDur) { P.state = 'free'; P.tool = null; const f = P.actFn; P.actFn = null; if (f) f(); }
    return;
  }
  if (P.state === 'hold') { P.actT -= dt; P.pose = 'hold'; if (P.actT <= 0) { P.state = 'free'; P.hold = null; } return; }
  if (P.state === 'fish') { updateFishing(dt, q); return; }
  const moving = IN.l || IN.r || IN.u || IN.d || Math.abs(IN.sx) > 0.2 || Math.abs(IN.sy) > 0.2;
  if (P.state === 'sit') {
    P.pose = P.seat ? 'sit' : 'sitg'; P.ft += dt; if (P.ft > 0.9) { P.ft = 0; P.f++; }
    P.sitT += dt; if (P.sitT >= 4) { P.sitT = 0; heal(fireLit() && Math.abs(P.x - 930) < 70 ? 2 : 1); S.daily.stats.rest += 4; }
    if (Math.random() < dt * 0.4) spawn('note', P.x + P.dir * 4, P.y - 40, { vy: -14, vx: rand(-4, 4), life: 1.6 });
    if (moving || q.some(a => a === 'act' || a === 'sit' || a === 'jump')) { P.state = 'free'; if (P.seat) { P.y = P.seat.y + 8; P.seat = null; } }
    return;
  }
  // free movement
  let mx = clamp((IN.r ? 1 : 0) - (IN.l ? 1 : 0) + IN.sx, -1, 1), my = clamp((IN.d ? 1 : 0) - (IN.u ? 1 : 0) + IN.sy, -1, 1);
  if (!IN.l && !IN.r && Math.abs(IN.sx) < 0.2) IN.run = false;
  const running = (IN.run || IN.stickRun) && Math.abs(mx) > 0.1;
  const sx = running ? 120 : 64, sy = running ? 70 : 44;
  const nx = P.x + mx * sx * dt, ny = P.y + my * sy * dt;
  if (walkable(nx, P.y)) P.x = nx; if (walkable(P.x, ny)) P.y = ny;
  if (mx > 0.1) P.dir = 1; else if (mx < -0.1) P.dir = -1;
  // jump physics
  if (P.z > 0 || P.vz > 0) { P.vz -= 560 * dt; P.z += P.vz * dt; if (P.z <= 0) { P.z = 0; P.vz = 0; SFX.land(); for (let i = 0; i < 5; i++) spawn('dust', P.x + rand(-6, 6), P.y, { vx: rand(-20, 20), vy: -rand(2, 8), life: 0.45 }); } }
  const air = P.z > 0;
  const walking = Math.abs(mx) > 0.1 || Math.abs(my) > 0.1;
  const prevPose = P.pose;
  P.pose = air ? (P.vz > 0 ? 'jump' : 'fall') : walking ? (running ? 'run' : 'walk') : 'idle';
  if (P.pose !== prevPose) { P.f = 0; P.ft = 0; }
  P.ft += dt; const fps = P.pose === 'run' ? 13 : P.pose === 'walk' ? 9 : 2.6;
  if (P.ft > 1 / fps) { P.ft = 0; P.f++; if (!air && (P.pose === 'walk' || P.pose === 'run') && P.f % 3 === 0) { SFX.step(surfaceAt(P.x, P.y)); if (running) spawn('dust', P.x - P.dir * 4, P.y, { vx: -P.dir * rand(10, 25), vy: -rand(2, 6), life: 0.35 }); } }
  if (running) scatterChicks();
  for (const a of q) {
    if (a === 'jump' && !air) { P.vz = 165; SFX.jump(); }
    else if (a === 'act' && !air) { if (G.target) doInteract(G.target); }
    else if (a === 'sit' && !air) sitDown();
    else if (a.startsWith('emote') && !air) emote(+a.slice(5));
  }
}
function sitDown(seat) {
  if (!seat) { const s = nearestSeat(); if (s) seat = s; }
  P.state = 'sit'; P.sitT = 0; P.f = 0; P.seat = seat || null;
  if (seat) { P.x = seat.x; P.y = seat.y; P.dir = seat.dir; }
  if (!S.tut.sit) { S.tut.sit = 1; UI.toast('앉아 있으면 천천히 힐링돼요. 모닥불 곁이라면 더 빨리!', 3800); }
}
function seats() { return [{ x: 474, y: 200.5, dir: 1 }, { x: 498, y: 200.5, dir: -1 }, { x: 902, y: 249.5, dir: 1 }, { x: 962, y: 251.5, dir: -1 }]; }
function nearestSeat() { let best = null, bd = 1e9; for (const s of seats()) { const d = Math.abs(s.x - P.x) + Math.abs(s.y - P.y) * 2; if (d < 26 && d < bd) { bd = d; best = s; } } return best; }
function emote(n) {
  P.emote = n; P.emoteT = 1.6; P.state = 'act'; P.actPose = n === 1 ? 'wave' : n === 2 ? 'cheer' : 'idle'; P.actT = 0; P.actDur = 1.2; P.f = 0;
  if (n === 3) hearts(P.x, P.y - 46, 3); if (n === 2) for (let i = 0; i < 10; i++) spawn('spark', P.x + rand(-10, 10), P.y - rand(30, 50), { vy: -rand(10, 40), life: rand(0.5, 1), col: pick(['#fff2a0', '#ffffff', '#c8ff9a']) });
  if (n === 1) spawn('note', P.x + P.dir * 6, P.y - 44, { vy: -16, life: 1.4 });
  SFX.pop();
  for (const npc of Object.values(NPCS)) {
    if (!npc.visible || Math.abs(npc.x - P.x) > 60 || Math.abs(npc.y - P.y) > 24) continue;
    npc.dir = P.x < npc.x ? -1 : 1; hearts(npc.x, npc.y - (npc.look.kid ? 36 : 46), 2);
    if (!S.daily.emoted[npc.id]) { S.daily.emoted[npc.id] = 1; heal(2, npc.x, npc.y - 50); addHeart(npc.id, 1); }

// --- interaction targets ---
function near(o, rx, ry) { return Math.abs(o.x - P.x) < rx && Math.abs(o.y - P.y) < ry; }
function plotLabel(p) {
  if (!p.crop) return SEEDS.some(s => count(s) > 0) ? '씨앗 심기' : '씨앗 심기 (씨앗 없음)';
  if (p.stage >= 3) return '수확하기';
  return p.wet > 0 ? '물 주기 (촉촉함)' : '물 주기';
}
function findTarget() {
  if (P.state !== 'free' || P.z > 0) return null;
  const c = [];
  const add = (kind, ref, label, x, y, h = 40) => { const dx = x - P.x, dy = y - P.y; c.push({ kind, ref, label, x, y, h, score: Math.abs(dx) + Math.abs(dy) * 2 - (dx * P.dir > 0 ? 6 : 0) + (dx * P.dir < -4 ? 10 : 0) }); };
  for (const npc of Object.values(NPCS)) if (npc.visible && npc.alpha > 0.6 && near(npc, 26, 13)) add('npc', npc, '대화하기', npc.x, npc.y, npc.look.kid ? 34 : 46);
  if (near(kitty, 22, 12)) add('cat', kitty, '쓰다듬기', kitty.x, kitty.y, 16);
  for (const ch of chicks) if (near(ch, 15, 9)) add('chick', ch, '쓰다듬기', ch.x, ch.y, 10);
  for (const ff of G.fireflies) if (Math.abs(ff.x - P.x) < 18 && Math.abs(ff.y - P.y) < 12) add('firefly', ff, '반딧불이 잡기', ff.x, ff.y, ff.z + 4);
  S.plots.forEach((p, i) => { const [x, y] = PLOTS_POS[i]; if (Math.abs(x - P.x) < 17 && Math.abs(y - P.y) < 10) add('plot', i, plotLabel(p), x, y, p.crop ? 18 : 8); });
  if (Math.abs(P.x - 215) < 16 && P.y < 200) add('door', null, '집에 들어가기', 215, 189, 44);
  if (near({ x: 314, y: 197 }, 16, 10)) add('mail', null, S.daily.letter !== null ? '편지 확인' : '우편함', 314, 196, 28);
  if (near({ x: 666, y: 216 }, 24, 12)) add('well', null, '소원 빌기', 666, 214, 36);
  if (near({ x: 930, y: 240 }, 24, 12)) add('fire', null, fireLit() ? '모닥불' : '모닥불 (저녁에 피워요)', 930, 238, 18);
  if (near({ x: 1024, y: 199 }, 18, 10)) add('board', null, '게시판 보기', 1024, 197, 34);
  const seat = nearestSeat(); if (seat) add('seat', seat, '앉기', seat.x, seat.y, 16);
  if (!c.length || c.every(o => o.score > 20)) {
    const fx = P.x + P.dir * 22;
    if (isWater(fx, P.y) && !onDock(fx, P.y)) add('fish', null, '낚시하기', fx, P.y, 4);
  }

function doInteract(t) {
  P.dir = t.x >= P.x ? 1 : -1;
  switch (t.kind) {
    case 'npc': talkTo(t.ref); break;
    case 'cat': petCat(); break;
    case 'chick': petChick(t.ref); break;
    case 'firefly': catchFirefly(t.ref); break;
    case 'plot': usePlot(t.ref); break;
    case 'door': useDoor(); break;
    case 'mail': readMail(); break;
    case 'well': useWell(); break;
    case 'fire': useFire(); break;
    case 'board': UI.openBoard(); break;
    case 'seat': sitDown(t.ref); break;
    case 'fish': startFishing(); break;
  }
}
function usePlot(i) {

    const have = SEEDS.filter(s => count(s) > 0);

      if (!takeItem(sid)) return; p.crop = sid.slice(5); p.stage = 0; p.grow = 0; p.wet = G.rain > 0.5 ? WET_TIME : 0; SFX.plant(); heal(3, x, y - 30);

      if (!S.tut.plant) { S.tut.plant = 1; UI.toast('씨앗을 심었어요! 물을 주면 자라요. 흙이 마르면 다시 물을 주세요.', 4200); }
    });

  }
  if (p.stage >= 3) {
    startAct('crouch', 0.55, null, () => {
      const crop = p.crop, [a, b] = CROPS[crop].yield, n = irand(a, b);
      addItem(crop, n); p.crop = null; p.stage = 0; p.grow = 0; SFX.harvest(); heal(10 + (crop === 'star' ? 20 : crop === 'sun' ? 6 : 0), x, y - 34);

      const first = !S.journal.crops[crop]; S.journal.crops[crop] = (S.journal.crops[crop] || 0) + n; if (first) setTimeout(() => UI.toast(`도감에 ${ITEMS[crop].name}이(가) 기록됐어요!`), 500);
      for (let k = 0; k < 10; k++) spawn('spark', x + rand(-8, 8), y - rand(4, 16), { vy: -rand(20, 40), life: rand(0.6, 1), col: '#fff2a0' });
    });
    return;
  }
  const wasDry = p.wet <= 0;
  startAct('reach', 0.9, () => { p.wet = WET_TIME; }, () => { if (wasDry) heal(3, x, y - 30); }, 'can');
  SFX.water();
}

function startFishing() {

  P.state = 'fish'; P.pose = 'fish'; P.f = 0;
  P.fish = { phase: 'cast', t: 0, bx, by: P.y + 1, wait: rand(2.2, 6) * (G.rain > 0.5 ? 0.7 : 1) * (hourNow() < 8 ? 0.8 : 1), zone: [0, 0], marker: 0, dm: 1, speed: 1, hold: 0, catch: null };

}
function rollFish() {
  const h = hourNow(), pool = FISH.filter(f => (f.lv || 1) <= S.lv && (!f.when || f.when(h)));

}

    if (pressed) { endFishing(); UI.toast('아무것도 걸리지 않았다.'); return; }
  } else if (F.phase === 'reel') {

function updateNPCs(dt) {

    const dP = Math.abs(P.x - npc.x);
    if (npc.talking) { npc.pose = 'talk'; npc.dir = P.x < npc.x ? -1 : 1; continue; }
    if (npc.id !== 'toto') { npc.pose = 'idle'; if (dP < 70 && Math.abs(P.y - npc.y) < 40) npc.dir = P.x < npc.x ? -1 : 1; continue; }
    // toto wanders and occasionally chases butterflies

      npc.pose = npc.mode;

      else { const nx = npc.x + dx / d * sp * dt, ny = npc.y + dy / d * sp * 0.7 * dt; if (walkable(nx, ny)) { npc.x = nx; npc.y = ny; } else { npc.mode = 'idle'; npc.t = 1; } npc.dir = dx < 0 ? -1 : 1; }

}

function scatterChicks() { for (const ch of chicks) { const dx = ch.x - P.x, dy = ch.y - P.y; if (Math.abs(dx) < 34 && Math.abs(dy) < 18) { ch.tx = clamp(ch.x + Math.sign(dx || 1) * 40, 110, 340); ch.ty = clamp(ch.y + Math.sign(dy || 1) * 14, 196, 258); ch.moving = true; ch.t = 2; ch.flee = true; } } }

const MOVE_KEYS = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd' };

function showTitle() {
  G.title = true; document.body.classList.add('in-title');
  S = newState('모험가', { ...custom }); S.time = 17.4 * 60;
  P.look = playerLook(custom); resetEntities();
  const saved = loadSave();
  $('contRow').hidden = !saved;
  if (saved) { $('btnContinue').textContent = `이어하기 · ${saved.name} ${saved.day}일차`; $('maker').hidden = true; $('newRow').hidden = true; }
  $('btnNew').textContent = saved ? '저장을 지우고 새로 시작' : '휴가 시작하기';
  $('btnShowMaker').onclick = () => { $('maker').hidden = false; $('newRow').hidden = false; $('btnShowMaker').hidden = true; };
  $('btnContinue').onclick = () => startGame(false);
  $('btnNew').onclick = () => startGame(true);
  buildMaker();
}

// --- loop ---
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; G.t += dt;
  if (G.title) {
    updateNPCs(dt); updateCat(dt); updateChicks(dt); updateCritters(dt);
    G.camX = clamp(560 + Math.sin(G.t * 0.06) * 420 - RD.VW / 2, 0, WORLD_W - RD.VW);
    drawPreview();
  } else if (!G.paused) {
    advanceTime(dt); updatePlayer(dt); updateNPCs(dt); updateCat(dt); updateChicks(dt); updateCritters(dt);
  }
  updateParticles(dt);
  if (!G.title) {
    const want = clamp(P.x - RD.VW / 2 + P.dir * 24, 0, WORLD_W - RD.VW); G.camX += (want - G.camX) * Math.min(1, dt * 4);
    G.target = UI.open ? null : findTarget();
    UI.updateHUD(dt); G.saveT += dt; if (G.saveT > 10) { G.saveT = 0; save(); }
  }
  UI.tick(dt);
  render();
  requestAnimationFrame(frame);
}
function boot(data) {
  if (data && data.save && data.save.v === 1) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(data.save)); } catch (e) { } }
  loadSettings(); updateSoundBtn();
  setupProps(); genLayers(); initRender(); applyLayout(); setupTouch();
  window.addEventListener('resize', applyLayout);
  window.addEventListener('orientationchange', () => setTimeout(applyLayout, 200));
  document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); if (AU.ctx) AU.ctx.suspend(); } else if (AU.ctx && !G.title) AU.ctx.resume(); });
  window.addEventListener('pagehide', save);
  $('btnBag').onclick = () => { auInit(); if (UI.open !== 'panel') UI.openBag(); };
  $('btnBook').onclick = () => { auInit(); if (UI.open !== 'panel') UI.openBook(); };
  $('btnSound').onclick = () => { auInit(); toggleSound(); };
  $('btnMenu').onclick = () => { auInit(); if (UI.open !== 'panel') UI.openMenu(); };
  $('panelClose').onclick = () => { SFX.click(); UI.closePanel(); };
  $('dialog').addEventListener('click', () => UI.advance());
  $('prompt').addEventListener('click', () => { auInit(); pressAction('act'); });
  $('view').addEventListener('pointerdown', () => { if (UI.open === 'dialog') UI.advance(); });
  document.querySelectorAll('#slots .slot').forEach(b => { const img = document.createElement('img'); img.alt = ''; img.src = slotIconURL(b.dataset.act); b.insertBefore(img, b.querySelector('span')); b.addEventListener('click', () => { auInit(); const a = b.dataset.act; pressAction(a === 'interact' ? 'act' : a); }); });
  showTitle();
  G.ready = true;
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { UI.hud = {}; });
  requestAnimationFrame(frame);
}
const HOT = window.claude && window.claude.hot;
if (HOT && HOT.snapshot) HOT.snapshot(() => (S && !G.title ? { save: S } : {}));
if (HOT && HOT.ready) HOT.ready(d => boot(d || {})); else boot((HOT && HOT.data) || {});

</script>
</body>
</html>
